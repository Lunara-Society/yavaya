<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        font-weight: 300;
        src: url("assets/fonts/Geist-Light.ttf") format("truetype");
      }
      @font-face {

      }
      @font-face {

      }
      :root {
        --ground: #050505;
        --ink: #f3ede2;
        --gold: #e2c27a;
        --gold-light: #f6dda0;
        --quiet: #8f8573;
      }
      * {
        margin: 0;

        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;

        background: var(--ground);
        font-family: "Geist", sans-serif;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #endcard {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      #wordmark {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 1128px;
        text-align: center;

        padding-left: 0.28em;
        color: var(--gold-light);
      }
      #wordmark span {
        display: inline-block;

      #tagline {
        position: absolute;
        left: 0;
        width: 1080px;

      }
      #note {
        position: absolute;

        letter-spacing: 0.02em;
        color: var(--quiet);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="19" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" width="1080" height="1920" data-start="0" data-duration="19" data-track-index="0"></canvas>

      <div id="endcard" class="clip" data-start="15.8" data-duration="3.2" data-track-index="1">
        <div id="wordmark"><span>Y</span><span>A</span><span>V</span><span>A</span><span>Y</span><span>A</span></div>
        <div id="tagline">Lo que nos une</div>
        <div id="note">Vista previa de diseño</div>
      </div>

      <!-- Music: the clock. Loudest at 3 s, near silence by 14 s; it returns under the eagle. -->
      <audio id="music" class="clip" data-start="0" data-duration="15.2" data-track-index="3" data-volume="0.9" data-fade-out="0.4" src="assets/audio/m_e42ec51c.wav"></audio>
      <audio id="music-return" class="clip" data-start="15" data-duration="4" data-media-start="2" data-track-index="4" data-volume="0.6" data-fade-in="0.25" data-fade-out="2" src="assets/audio/m_e42ec51c.wav"></audio>
      <!-- Effects: each lands one frame after its picture. -->
      <audio id="sfx-arrival" class="clip" data-start="0.763" data-duration="6.6" data-track-index="2" data-volume="0.85" src="assets/audio/sfx_arrival_267aac82.mp3"></audio>
      <audio id="sfx-card-1" class="clip" data-start="5.833" data-duration="1.42" data-track-index="5" data-volume="0.45" src="assets/audio/sfx_whoosh_a_a4855a82.mp3"></audio>
      <audio id="sfx-card-2" class="clip" data-start="6.498" data-duration="1.05" data-track-index="6" data-volume="0.4" src="assets/audio/sfx_whoosh_b_00caa739.mp3"></audio>
      <audio id="sfx-card-3" class="clip" data-start="6.518" data-duration="2.52" data-track-index="7" data-volume="0.35" src="assets/audio/sfx_whoosh_c_2e34dc51.mp3"></audio>
      <audio id="sfx-card-4" class="clip" data-start="7.123" data-duration="1.42" data-track-index="8" data-volume="0.4" src="assets/audio/sfx_whoosh_a_a4855a82.mp3"></audio>
      <audio id="sfx-card-5" class="clip" data-start="7.788" data-duration="1.05" data-track-index="6" data-volume="0.35" src="assets/audio/sfx_whoosh_b_00caa739.mp3"></audio>
      <audio id="sfx-release" class="clip" data-start="10.618" data-duration="3.8" data-track-index="2" data-volume="0.6" src="assets/audio/sfx_release_69406ab5.mp3"></audio>
      <audio id="sfx-mark" class="clip" data-start="14.613" data-duration="3" data-track-index="2" data-volume="0.9" src="assets/audio/sfx_mark_128d8419.mp3"></audio>
    </div>

    <script src="assets/roxi_points.js"></script>
    <script src="assets/eagle_points.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }
    </script>

    <!-- The stage: every frame drawn from timeline time alone. -->
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const W = 1080;
      const H = 1920;
      const FOV = 30;
      const PIXEL = H / (2 * Math.tan(((FOV / 2) * Math.PI) / 180));

      // ---------- small helpers ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const smooth = (a, b, x) => {
        const t = clamp((x - a) / (b - a));
        return t * t * (3 - 2 * t);
      };
      const expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const inOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const powIn = (x) => x * x * x;
      const span = (t, a, b) => clamp((t - a) / (b - a));
      function mulberry32(seed) {
        return () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
      }
      function unpack(points) {
        const bin = Uint8Array.from(atob(points.data), (c) => c.charCodeAt(0));
        const n = points.count;
        const q = new Uint16Array(bin.buffer, 0, n * 3);
        const c = new Uint8Array(bin.buffer, n * 6, n * 3);
        return { n, q, c };
      }
      const col = (hex) => new THREE.Color(hex);

      // ---------- palette (linear, via THREE.Color) ----------
      const GOLD = col("#E2C27A");
      const GOLD_LIGHT = col("#F6DDA0");
      const GOLD_HOT = col("#FFF3D6");
      const VIOLET = col("#8E7CFF");

      // ---------- renderer ----------
      const canvas = document.getElementById("stage");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x050505, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 200);

      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.9, 0.55, 0.9);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // ---------- world layout ----------
      const ROXI_H = 10;
      const ROXI_W = (ROXI_H * 720) / 1544;
      const HAND = new THREE.Vector3((0.216 - 0.5) * ROXI_W, (0.5 - 0.602) * ROXI_H, 0.5);
      const CHEST_LIGHT = new THREE.Vector3(0, 1.15, 2.6);
      const MEET = new THREE.Vector3(0, 1.6, 6);
      const ARC = { radius: 4.2, axisZ: 1.8, y: 0.55, step: (30 * Math.PI) / 180 };
      const CARD_W = 2.6;
      const CARD_H = 3.4;
      const EAGLE_S = 3.8;

      // ---------- background: obsidian, warm floor light, vignette ----------
      const bgMat = new THREE.ShaderMaterial({
        depthWrite: false,
        uniforms: { uFloor: { value: 0 }, uHaze: { value: 0 }, uGold: { value: GOLD } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uFloor; uniform float uHaze; uniform vec3 uGold;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
          void main(){
            vec3 c = vec3(0.0016);
            vec2 f = (vUv - vec2(0.5, 0.215)) * vec2(1.0, 2.6);
            c += uGold * 0.028 * uFloor * exp(-dot(f,f)*7.0);
            vec2 h = (vUv - vec2(0.5, 0.62)) * vec2(1.0, 0.8);
            c += uGold * 0.006 * uHaze * exp(-dot(h,h)*6.0);
            float v = smoothstep(0.95, 0.25, length((vUv-0.5)*vec2(1.0,0.75)));
            c *= mix(0.55, 1.0, v);
            c += (hash(gl_FragCoord.xy) - 0.5) * 0.0015;
            gl_FragColor = vec4(c, 1.0);
          }`,
      });
      const bg = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), bgMat);
      bg.position.set(0, 0, -20);
      bg.renderOrder = -10;
      scene.add(bg);

      // ---------- Roxi: her image, focus, gold sheen, rims ----------
      const loader = new THREE.TextureLoader();
      const loadTex = (src) =>
        new Promise((resolve, reject) =>
          loader.load(src, (tex) => {
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 4;
            resolve(tex);
          }, undefined, reject),
        );

      const roxiMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: {
          uSharp: { value: null },
          uBlur: { value: null },
          uOpacity: { value: 0 },
          uFocus: { value: 1 },
          uDim: { value: 1 },
          uSheen: { value: -1 },
          uGold: { value: GOLD_LIGHT },
          uViolet: { value: VIOLET },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          varying vec2 vUv;
          uniform sampler2D uSharp; uniform sampler2D uBlur;
          uniform float uOpacity; uniform float uFocus; uniform float uDim; uniform float uSheen;
          uniform vec3 uGold; uniform vec3 uViolet;
          void main(){
            vec4 s = texture2D(uSharp, vUv);
            vec4 b = texture2D(uBlur, vUv);
            vec4 c = mix(b, s, uFocus);
            vec2 d = vec2(2.0/720.0, 2.0/1544.0);
            float gx = texture2D(uSharp, vUv + vec2(d.x,0.0)).a - texture2D(uSharp, vUv - vec2(d.x,0.0)).a;
            float gy = texture2D(uSharp, vUv + vec2(0.0,d.y)).a - texture2D(uSharp, vUv - vec2(0.0,d.y)).a;
            float edge = clamp(length(vec2(gx,gy))*1.6, 0.0, 1.0) * uFocus;
            float left = clamp(gx*2.0, 0.0, 1.0);   // lit from her right (viewer left)
            float right = clamp(-gx*2.0, 0.0, 1.0);
            vec3 rgb = c.rgb * uDim;
            rgb += uGold * edge * (0.15 + left*0.45) * uDim;
            rgb += uViolet * right * 0.12 * uDim * uFocus;
            float lum = dot(c.rgb, vec3(0.299,0.587,0.114));
            float band = exp(-pow((1.0 - vUv.y - uSheen) * 11.0, 2.0));
            rgb += uGold * band * (0.12 + lum*0.9) * c.a * uFocus;
            gl_FragColor = vec4(rgb, c.a * uOpacity);
          }`,
      });
      const roxi = new THREE.Mesh(new THREE.PlaneGeometry(ROXI_W, ROXI_H), roxiMat);
      roxi.renderOrder = 1;
      scene.add(roxi);

      // ---------- Roxi's points: dust → her → released ----------
      const POINT_VERT_HEAD = `
        uniform float uTime; uniform float uPixel; uniform vec3 uGold; uniform vec3 uGoldHot;
        varying vec3 vColor; varying float vAlpha;
        vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
        float eOut(float x){ return 1.0 - pow(1.0 - x, 3.4); }
        vec3 spinY(vec3 p, vec3 axis, float a){
          vec3 r = p - vec3(axis.x, p.y, axis.z);
          float c = cos(a), s = sin(a);
          return vec3(r.x*c - r.z*s + axis.x, p.y, r.x*s + r.z*c + axis.z);
        }
        void finish(vec3 p, float size, vec3 color, float alpha){
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_Position = projectionMatrix * mv;
          gl_PointSize = clamp(size * uPixel / -mv.z, 0.0, 7.0);
          vColor = color; vAlpha = alpha;
        }`;
      const POINT_FRAG = `
        varying vec3 vColor; varying float vAlpha;
        void main(){
          float r = length(gl_PointCoord - 0.5);
          float m = smoothstep(0.5, 0.06, r); m *= m;
          gl_FragColor = vec4(vColor, m * vAlpha);
        }`;
      const pointMaterial = (main) =>
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          uniforms: {
            uTime: { value: 0 },
            uPixel: { value: PIXEL },
            uGold: { value: GOLD_LIGHT },
            uGoldHot: { value: GOLD_HOT },
          },
          vertexShader: POINT_VERT_HEAD + main,
          fragmentShader: POINT_FRAG,
        });

      function buildRoxiPoints() {
        const { n, q, c } = unpack(window.ROXI_POINTS);
        const rnd = mulberry32(7);
        const target = new Float32Array(n * 3);
        const start = new Float32Array(n * 3);
        const color = new Float32Array(n * 3);
        const rand = new Float32Array(n * 4);
        const uvs = new Float32Array(n * 2);
        for (let i = 0; i < n; i++) {
          const u = q[i * 3] / 65535;
          const v = q[i * 3 + 1] / 65535;
          const z = q[i * 3 + 2] / 65535;
          target[i * 3] = (u - 0.5) * ROXI_W;
          target[i * 3 + 1] = (0.5 - v) * ROXI_H;
          target[i * 3 + 2] = (z - 0.5) * 0.9;
          // Dust: a deep, wide volume, denser near her.
          const rr = Math.pow(rnd(), 0.6);
          const a = rnd() * Math.PI * 2;
          start[i * 3] = Math.cos(a) * rr * 6.5;
          start[i * 3 + 1] = (rnd() - 0.5) * 17;
          start[i * 3 + 2] = Math.sin(a) * rr * 6.5 - 1.5;
          color[i * 3] = c[i * 3] / 255;
          color[i * 3 + 1] = c[i * 3 + 1] / 255;
          color[i * 3 + 2] = c[i * 3 + 2] / 255;
          rand[i * 4] = rnd();
          rand[i * 4 + 1] = rnd();
          rand[i * 4 + 2] = rnd();
          rand[i * 4 + 3] = rnd();
          uvs[i * 2] = u;
          uvs[i * 2 + 1] = v;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(target, 3));
        g.setAttribute("aStart", new THREE.BufferAttribute(start, 3));
        g.setAttribute("aColor", new THREE.BufferAttribute(color, 3));
        g.setAttribute("aRand", new THREE.BufferAttribute(rand, 4));
        g.setAttribute("aUV", new THREE.BufferAttribute(uvs, 2));
        const m = pointMaterial(`
          attribute vec3 aStart; attribute vec3 aColor; attribute vec4 aRand; attribute vec2 aUV;
          void main(){
            float t = uTime;
            vec3 target = position;
            float size = 0.0165 * mix(0.7, 1.45, aRand.x);
            vec3 trueCol = lin(aColor) * 1.08 + 0.01;
            if (t < 11.0) {
              vec3 drift = vec3(sin(t*0.35 + aRand.y*6.2831), cos(t*0.27 + aRand.z*6.2831), sin(t*0.21 + aRand.w*6.2831)) * 0.18;
              vec3 dust = aStart + drift;
              float core = length(vec2((aUV.x-0.5)*1.1, (aUV.y-0.38)*0.55));
              float delay = clamp(core*1.25, 0.0, 0.85) + aRand.y*0.22;
              float pa = clamp((t - 1.5 - delay) / 1.35, 0.0, 1.0);
              float e = eOut(pa);
              vec3 p = mix(dust, target, e);
              p = spinY(p, vec3(0.0, 0.0, 0.3), pow(1.0 - e, 1.7) * (1.6 + aRand.z*1.4));
              // Gold light until she lands: her own colours arrive only in the last fifth of each flight.
              float landing = smoothstep(0.8, 1.0, pa);
              float glow = mix(1.9, 1.0, landing);
              vec3 c = mix(uGold * glow, trueCol, landing);
              float dustA = 0.06 + 0.06 * smoothstep(0.2, 1.5, t);
              float a = mix(dustA, 0.68, smoothstep(0.0, 0.3, pa)) * mix(1.0, 1.35, landing) * (1.0 - smoothstep(3.85, 4.5, t));
              finish(p, size * mix(1.25, 0.85, landing), c, a);
            } else {
              float delayR = aUV.y*0.75 + aRand.w*0.2;
              float pr = clamp((t - 11.75 - delayR) / 1.25, 0.0, 1.0);
              float er = pr*pr*(1.6 - 0.6*pr);
              vec3 dir = normalize(vec3(target.x, 0.0, target.z - 0.3) + vec3(0.0001));
              vec3 p = target + vec3(dir.x*er*1.6, er*6.5 + er*er*3.0, dir.z*er*1.6);
              p = spinY(p, vec3(0.0, 0.0, 0.3), er * (1.2 + aRand.z));
              vec3 c = mix(trueCol, uGold * 1.4, smoothstep(0.0, 0.45, pr));
              float a = smoothstep(11.55, 11.85, t) * (1.0 - smoothstep(0.55, 1.0, pr));
              finish(p, size, c, a);
            }
          }`);
        const pts = new THREE.Points(g, m);
        pts.frustumCulled = false;
        pts.renderOrder = 2;
        scene.add(pts);
        return pts;
      }

      // ---------- light: soft sprite texture ----------
      function glowTexture() {
        const s = 256;
        const cv = document.createElement("canvas");
        cv.width = cv.height = s;
        const g = cv.getContext("2d");
        const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grd.addColorStop(0, "rgba(255,246,224,1)");
        grd.addColorStop(0.18, "rgba(246,221,160,0.55)");
        grd.addColorStop(0.5, "rgba(226,194,122,0.12)");
        grd.addColorStop(1, "rgba(226,194,122,0)");
        g.fillStyle = grd;
        g.fillRect(0, 0, s, s);
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const glowTex = glowTexture();
      const makeGlow = () => {
        const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
        sp.renderOrder = 5;
        scene.add(sp);
        return sp;
      };
      const heartGlow = makeGlow();
      const handGlow = makeGlow();
      const meetGlow = makeGlow();

      // Rays around the light in her hand.
      const raysMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uAmount: { value: 0 }, uGold: { value: GOLD_LIGHT } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform float uTime; uniform float uAmount; uniform vec3 uGold;
          void main(){
            vec2 p = vUv - 0.5; float r = length(p); float a = atan(p.y, p.x);
            float rays = pow(abs(sin(a*9.0 + uTime*0.35)), 28.0) + 0.6*pow(abs(sin(a*14.0 - uTime*0.22 + 1.3)), 40.0);
            float fall = smoothstep(0.5, 0.04, r) * smoothstep(0.0, 0.05, r);
            gl_FragColor = vec4(uGold, rays * fall * uAmount * 0.45);
          }`,
      });
      const rays = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), raysMat);
      rays.renderOrder = 4;
      scene.add(rays);

      // ---------- cards ----------
      const CARDS = [
        { name: "Trabajo", line: "Ofertas con pago visible" },
        { name: "Servicios", line: "Gente que resuelve hoy" },
        { name: "Mercadito", line: "Compra y vende cerca de ti" },
        { name: "YavayaGo", line: "Entregas y viajes de confianza" },
        { name: "Barrio", line: "Cortes de agua y luz, avisos" },
      ];
      const FLIGHT_ORDER = [2, 3, 1, 4, 0]; // the front card first, then its neighbours
      const CARD_START = 6.2;
      const CARD_STAGGER = 0.43;
      const CARD_FLIGHT = 0.9;
      const TEX_W = 780;
      const TEX_H = 1020;

      function roundRect(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y);
        g.arcTo(x + w, y, x + w, y + h, r);
        g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r);
        g.arcTo(x, y, x + w, y, r);
        g.closePath();
      }
      function wrap(g, text, maxW) {
        const words = text.split(" ");
        const lines = [];
        let cur = "";
        for (const w of words) {
          const next = cur ? `${cur} ${w}` : w;
          if (g.measureText(next).width > maxW && cur) {
            lines.push(cur);
            cur = w;
          } else cur = next;
        }
        if (cur) lines.push(cur);
        return lines;
      }
      function drawCard(card, blurPx) {
        const cv = document.createElement("canvas");
        cv.width = TEX_W;
        cv.height = TEX_H;
        const g = cv.getContext("2d");
        g.filter = blurPx ? `blur(${blurPx}px)` : "none";
        const pad = 6;
        const r = 54;
        roundRect(g, pad, pad, TEX_W - pad * 2, TEX_H - pad * 2, r);
        g.fillStyle = "rgba(14,12,9,0.93)";
        g.fill();
        const hl = g.createLinearGradient(0, 0, 0, TEX_H * 0.35);
        hl.addColorStop(0, "rgba(246,221,160,0.10)");
        hl.addColorStop(1, "rgba(246,221,160,0)");
        g.fillStyle = hl;
        g.fill();
        const corner = g.createRadialGradient(90, 80, 0, 90, 80, 420);
        corner.addColorStop(0, "rgba(246,221,160,0.16)");
        corner.addColorStop(1, "rgba(246,221,160,0)");
        g.fillStyle = corner;
        g.fill();
        g.lineWidth = 4.5;
        g.strokeStyle = "rgba(226,194,122,0.92)";
        g.stroke();
        // Small gold mark: a ring with a point, Yavaya's light.
        g.beginPath();
        g.arc(96, 120, 22, 0, Math.PI * 2);
        g.lineWidth = 3;
        g.strokeStyle = "rgba(226,194,122,0.95)";
        g.stroke();
        g.beginPath();
        g.arc(96, 120, 7, 0, Math.PI * 2);
        g.fillStyle = "rgba(246,221,160,1)";
        g.fill();
        g.fillStyle = "#F3EDE2";
        g.font = "600 92px Geist";
        g.textBaseline = "alphabetic";
        g.fillText(card.name, 72, 560);
        g.fillStyle = "#CDBFA5";
        g.font = "400 50px Geist";
        wrap(g, card.line, TEX_W - 150).forEach((l, i) => g.fillText(l, 72, 640 + i * 64));
        g.fillStyle = "rgba(226,194,122,0.85)";
        g.fillRect(72, 860, TEX_W - 144, 3);
        g.fillStyle = "#E2C27A";
        g.font = "600 44px Geist";
        g.fillText("Abrir", 72, 940);
        g.fillText("→", TEX_W - 120, 940);
        return cv;
      }

      const cardMat = (sharp, blur) =>
        new THREE.ShaderMaterial({
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
          uniforms: { uSharp: { value: sharp }, uBlur: { value: blur }, uOpacity: { value: 0 }, uFocus: { value: 1 }, uDim: { value: 1 } },
          vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `
            varying vec2 vUv; uniform sampler2D uSharp; uniform sampler2D uBlur; uniform float uOpacity; uniform float uFocus; uniform float uDim;
            void main(){ vec4 c = mix(texture2D(uBlur, vUv), texture2D(uSharp, vUv), uFocus); gl_FragColor = vec4(c.rgb * uDim, c.a * uOpacity); }`,
        });

      const cardMeshes = [];
      const cardCanvases = [];
      function buildCards() {
        CARDS.forEach((card) => {
          const sharp = drawCard(card, 0);
          const blur = drawCard(card, 16);
          cardCanvases.push(sharp);
          const ts = new THREE.CanvasTexture(sharp);
          const tb = new THREE.CanvasTexture(blur);
          for (const t of [ts, tb]) {
            t.colorSpace = THREE.SRGBColorSpace;
            t.anisotropy = 4;
          }
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), cardMat(ts, tb));
          mesh.renderOrder = 6;
          scene.add(mesh);
          cardMeshes.push(mesh);
        });
      }

      // The arc's turn: Mercadito in front, then the arc eases one step to YavayaGo.
      const arcK = (t) => 2 + inOut(span(t, 9.0, 10.3)) + 0.06 * span(t, 7.5, 11.6);
      function slot(i, t) {
        const th = (i - arcK(t)) * ARC.step;
        return {
          pos: new THREE.Vector3(Math.sin(th) * ARC.radius, ARC.y, ARC.axisZ + Math.cos(th) * ARC.radius),
          rotY: th,
          th,
        };
      }
      function cardState(i, t) {
        const order = FLIGHT_ORDER.indexOf(i);
        const t0 = CARD_START + order * CARD_STAGGER;
        const f = span(t, t0, t0 + CARD_FLIGHT);
        const e = expoOut(f);
        const s = slot(i, t);
        const pos = new THREE.Vector3().lerpVectors(CHEST_LIGHT, s.pos, e);
        pos.y += Math.sin(f * Math.PI) * 0.35;
        const off = clamp(Math.abs(s.th) / ARC.step);
        const flightBlur = 1 - smooth(0.25, 0.85, f);
        return {
          pos,
          rotY: s.rotY * e,
          scale: 0.12 + 0.88 * e,
          opacity: smooth(0.0, 0.25, f) * (1 - smooth(11.6, 11.95, t)),
          focus: 1 - clamp(Math.max(off * 0.92, flightBlur)),
          dim: 1 - 0.38 * off,
          landed: f,
        };
      }

      // Threads of light from her hand to each card.
      const threadMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uGold: { value: GOLD_LIGHT } },
        vertexShader: `attribute float aS; attribute float aLine; attribute float aGrow; varying float vS; varying float vLine; varying float vGrow;
          void main(){ vS = aS; vLine = aLine; vGrow = aGrow; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `varying float vS; varying float vLine; varying float vGrow; uniform float uTime; uniform vec3 uGold;
          void main(){
            if (vS > vGrow) discard;
            float pulse = exp(-pow((vS - fract(uTime*0.55 + vLine*0.21)) * 9.0, 2.0));
            gl_FragColor = vec4(uGold, (0.42 + 1.0*pulse) * smoothstep(0.0, 0.08, vS));
          }`,
      });
      const THREAD_SEG = 40;
      const THREAD_COPIES = [-1, 0, 1]; // three hairlines side by side read as one thread of light
      const THREAD_V = CARDS.length * THREAD_COPIES.length * THREAD_SEG * 2;
      const threadGeo = new THREE.BufferGeometry();
      const threadPos = new Float32Array(THREAD_V * 3);
      const threadS = new Float32Array(THREAD_V);
      const threadLine = new Float32Array(THREAD_V);
      const threadGrow = new Float32Array(THREAD_V);
      const threadIdx = (i, c, k, j) => ((i * THREAD_COPIES.length + c) * THREAD_SEG + k) * 2 + j;
      for (let i = 0; i < CARDS.length; i++)
        for (let c = 0; c < THREAD_COPIES.length; c++)
          for (let k = 0; k < THREAD_SEG; k++)
            for (let j = 0; j < 2; j++) {
              const idx = threadIdx(i, c, k, j);
              threadS[idx] = (k + j) / THREAD_SEG;
              threadLine[idx] = i;
            }
      threadGeo.setAttribute("position", new THREE.BufferAttribute(threadPos, 3));
      threadGeo.setAttribute("aS", new THREE.BufferAttribute(threadS, 1));
      threadGeo.setAttribute("aLine", new THREE.BufferAttribute(threadLine, 1));
      threadGeo.setAttribute("aGrow", new THREE.BufferAttribute(threadGrow, 1));
      const threads = new THREE.LineSegments(threadGeo, threadMat);
      threads.frustumCulled = false;
      threads.renderOrder = 5;
      scene.add(threads);

      function setThreads(t) {
        const from = new THREE.Vector3();
        handPath(t, from);
        for (let i = 0; i < CARDS.length; i++) {
          const st = cardState(i, t);
          const to = st.pos.clone().add(new THREE.Vector3(0, (-CARD_H / 2) * st.scale, 0));
          const ctrl = from.clone().lerp(to, 0.5).add(new THREE.Vector3(0, -0.6, 0.4));
          const grow = st.landed * (1 - smooth(11.55, 11.8, t));
          for (let c = 0; c < THREAD_COPIES.length; c++)
            for (let k = 0; k < THREAD_SEG; k++)
              for (let j = 0; j < 2; j++) {
                const s = (k + j) / THREAD_SEG;
                const a = from.clone().lerp(ctrl, s);
                const b = ctrl.clone().lerp(to, s);
                const p = a.lerp(b, s);
                const idx = threadIdx(i, c, k, j);
                threadPos.set([p.x + THREAD_COPIES[c] * 0.011, p.y + THREAD_COPIES[c] * 0.004, p.z], idx * 3);
                threadGrow[idx] = grow;
              }
        }
        threadGeo.attributes.position.needsUpdate = true;
        threadGeo.attributes.aGrow.needsUpdate = true;
      }

      // ---------- card points: the cards break into light ----------
      function buildCardPoints() {
        const per = 5200;
        const n = per * CARDS.length;
        const rnd = mulberry32(11);
        const pos = new Float32Array(n * 3);
        const colr = new Float32Array(n * 3);
        const rand = new Float32Array(n * 4);
        const uvs = new Float32Array(n * 2);
        for (let i = 0; i < CARDS.length; i++) {
          const g = cardCanvases[i].getContext("2d");
          const img = g.getImageData(0, 0, TEX_W, TEX_H).data;
          const st = cardState(i, 11.6);
          const m = new THREE.Matrix4().compose(st.pos, new THREE.Quaternion().setFromEuler(new THREE.Euler(0, st.rotY, 0)), new THREE.Vector3(st.scale, st.scale, st.scale));
          let k = 0;
          let guard = 0;
          while (k < per && guard < per * 60) {
            guard++;
            const u = rnd();
            const v = rnd();
            const px = Math.floor(u * (TEX_W - 1));
            const py = Math.floor(v * (TEX_H - 1));
            const o = (py * TEX_W + px) * 4;
            if (img[o + 3] < 40) continue;
            const lum = (img[o] + img[o + 1] + img[o + 2]) / 765;
            if (rnd() > 0.12 + lum * 1.4) continue;
            const p = new THREE.Vector3((u - 0.5) * CARD_W, (0.5 - v) * CARD_H, 0).applyMatrix4(m);
            const idx = i * per + k;
            pos.set([p.x, p.y, p.z], idx * 3);
            colr.set([img[o] / 255, img[o + 1] / 255, img[o + 2] / 255], idx * 3);
            rand.set([rnd(), rnd(), rnd(), rnd()], idx * 4);
            uvs.set([u, v], idx * 2);
            k++;
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        g.setAttribute("aColor", new THREE.BufferAttribute(colr, 3));
        g.setAttribute("aRand", new THREE.BufferAttribute(rand, 4));
        g.setAttribute("aUV", new THREE.BufferAttribute(uvs, 2));
        const m = pointMaterial(`
          attribute vec3 aColor; attribute vec4 aRand; attribute vec2 aUV;
          void main(){
            float t = uTime;
            float pr = clamp((t - 11.6 - aUV.y*0.32 - aRand.x*0.25) / 1.3, 0.0, 1.0);
            float er = pr*pr*(1.7 - 0.7*pr);
            vec3 p = position + vec3((aRand.y-0.5)*er*2.2, er*5.5 + er*er*2.5, (aRand.z-0.5)*er*1.4);
            p = spinY(p, vec3(0.0, 0.0, 2.0), er * (0.9 + aRand.w*0.8));
            vec3 c = mix(lin(aColor)*1.3 + uGold*0.15, uGold*1.5, smoothstep(0.0, 0.5, pr));
            float a = smoothstep(11.55, 11.75, t) * (1.0 - smoothstep(0.5, 1.0, pr));
            finish(p, 0.015 * mix(0.8, 1.3, aRand.x), c, a);
          }`);
        const pts = new THREE.Points(g, m);
        pts.frustumCulled = false;
        pts.renderOrder = 7;
        scene.add(pts);
        return pts;
      }

      // ---------- the held breath: one thread glints ----------
      const breathMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: { uTime: { value: 0 }, uGold: { value: GOLD_LIGHT } },
        vertexShader: `attribute float aS; varying float vS; void main(){ vS = aS; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `varying float vS; uniform float uTime; uniform vec3 uGold;
          void main(){
            float on = smoothstep(13.25, 13.6, uTime) * (1.0 - smoothstep(14.05, 14.3, uTime));
            float glint = exp(-pow((vS - (uTime - 13.35) * 1.05) * 7.0, 2.0));
            float ends = smoothstep(0.0, 0.25, vS) * smoothstep(1.0, 0.75, vS);
            gl_FragColor = vec4(uGold, on * ends * (0.22 + 1.1*glint));
          }`,
      });
      const breathGeo = new THREE.BufferGeometry();
      breathGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array([-2.4, MEET.y, MEET.z, 2.4, MEET.y, MEET.z]), 3));
      breathGeo.setAttribute("aS", new THREE.BufferAttribute(new Float32Array([0, 1]), 1));
      const breath = new THREE.Line(breathGeo, breathMat);
      breath.renderOrder = 5;
      scene.add(breath);

      // ---------- el hilo: two strands become one ----------
      function buildStrands() {
        const per = 3600;
        const n = per * 2;
        const rnd = mulberry32(23);
        const pos = new Float32Array(n * 3);
        const par = new Float32Array(n * 4);
        for (let i = 0; i < n; i++) {
          par.set([i < per ? 0 : 1, rnd(), rnd(), rnd()], i * 4);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        g.setAttribute("aPar", new THREE.BufferAttribute(par, 4));
        const m = pointMaterial(`
          attribute vec4 aPar;
          uniform vec3 uMeet;
          void main(){
            float t = uTime;
            float side = aPar.x < 0.5 ? 1.0 : -1.0;
            float k = clamp((t - 14.2) / 0.8, 0.0, 1.0);
            float ek = 1.0 - pow(1.0 - k, 3.0);
            float L = 7.0 * (1.0 - smoothstep(0.7, 1.0, k));
            float y = side * (mix(9.5, 0.0, ek) + aPar.y * L);
            float rad = 0.9 * clamp(abs(y) / 5.0, 0.0, 1.0) + 0.04;
            float ang = y * 1.25 + t * 2.2 + aPar.x * 3.14159;
            vec3 jit = (aPar.zwz - 0.5) * 0.05;
            vec3 p = uMeet + vec3(cos(ang) * rad, y, sin(ang) * rad) + jit;
            float a = smoothstep(14.15, 14.4, t) * (1.0 - smoothstep(15.0, 15.18, t)) * (1.0 - aPar.y * 0.75) * (1.0 - 0.6 * smoothstep(0.8, 1.0, k));
            finish(p, 0.017, uGold * 1.5, a);
          }`);
        m.uniforms.uMeet = { value: MEET };
        const pts = new THREE.Points(g, m);
        pts.frustumCulled = false;
        pts.renderOrder = 8;
        scene.add(pts);
        return pts;
      }

      // ---------- the eagle: drawn in light, then real ----------
      function buildEaglePoints() {
        const { n, q, c } = unpack(window.EAGLE_POINTS);
        const rnd = mulberry32(31);
        const target = new Float32Array(n * 3);
        const colr = new Float32Array(n * 3);
        const rand = new Float32Array(n * 4);
        for (let i = 0; i < n; i++) {
          const u = q[i * 3] / 65535;
          const v = q[i * 3 + 1] / 65535;
          const z = q[i * 3 + 2] / 65535;
          target.set([MEET.x + (u - 0.5) * EAGLE_S, MEET.y + (0.5 - v) * EAGLE_S, MEET.z + (z - 0.5) * 0.25], i * 3);
          colr.set([c[i * 3] / 255, c[i * 3 + 1] / 255, c[i * 3 + 2] / 255], i * 3);
          rand.set([rnd(), rnd(), rnd(), Math.hypot(u - 0.5, v - 0.5) / 0.7071], i * 4);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(target, 3));
        g.setAttribute("aColor", new THREE.BufferAttribute(colr, 3));
        g.setAttribute("aRand", new THREE.BufferAttribute(rand, 4));
        const m = pointMaterial(`
          attribute vec3 aColor; attribute vec4 aRand;
          uniform vec3 uMeet;
          void main(){
            float t = uTime;
            float pe = clamp((t - 15.0 - aRand.w * 0.35 - aRand.x * 0.12) / 0.85, 0.0, 1.0);
            float e = 1.0 - pow(1.0 - pe, 3.6);
            vec3 rel = position - uMeet;
            float ang = pow(1.0 - e, 2.0) * (1.1 + aRand.y * 0.8);
            float c = cos(ang), s = sin(ang);
            vec3 r = vec3(rel.x * c - rel.y * s, rel.x * s + rel.y * c, rel.z) * e;
            vec3 seed = vec3(cos(aRand.y * 6.2831), sin(aRand.y * 6.2831), 0.0) * 0.55 * aRand.z;
            vec3 p = uMeet + r + seed * (1.0 - e);
            vec3 col = mix(uGold * 1.2, lin(aColor) * 1.2, smoothstep(0.5, 1.0, e));
            float a = smoothstep(14.98, 15.08, t) * (1.0 - smoothstep(15.85, 16.35, t)) * mix(0.12, 1.0, e);
            finish(p, 0.0155 * mix(0.8, 1.3, aRand.x), col, a);
          }`);
        m.uniforms.uMeet = { value: MEET };
        const pts = new THREE.Points(g, m);
        pts.frustumCulled = false;
        pts.renderOrder = 9;
        scene.add(pts);
        return pts;
      }
      const eagleMat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        uniforms: { uTex: { value: null }, uOpacity: { value: 0 }, uGold: { value: GOLD } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
          varying vec2 vUv; uniform sampler2D uTex; uniform float uOpacity; uniform vec3 uGold;
          float rbox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
          void main(){
            vec2 p = vUv - 0.5;
            float d = rbox(p, vec2(0.5), 0.12);
            float inside = smoothstep(0.002, -0.002, d);
            float edge = smoothstep(0.009, 0.0, abs(d + 0.006));
            vec3 c = texture2D(uTex, vUv).rgb * inside + uGold * edge * 1.2;
            gl_FragColor = vec4(c, max(inside, edge) * uOpacity);
          }`,
      });
      const eagle = new THREE.Mesh(new THREE.PlaneGeometry(EAGLE_S, EAGLE_S), eagleMat);
      eagle.position.copy(MEET);
      eagle.renderOrder = 10;
      scene.add(eagle);

      // ---------- the light's path: heart, hand, chest ----------
      function handPath(t, out) {
        const rise = inOut(span(t, 5.7, 6.3));
        return out.lerpVectors(HAND, CHEST_LIGHT, rise);
      }

      // ---------- one frame, from time alone ----------
      let roxiPts, cardPts, strandPts, eaglePts;
      function renderAt(t) {
        // Camera: a slow push as she resolves, back out for the arc.
        const push = inOut(span(t, 4.0, 5.2)) * (1 - inOut(span(t, 6.0, 7.0)));
        camera.position.set(0, 0.3 + push * 0.25, 24 - push * 1.45);
        camera.lookAt(0, 0.3 + push * 0.25, 0);

        bgMat.uniforms.uFloor.value = smooth(3.2, 4.4, t) * (1 - smooth(11.8, 12.8, t)) + 0.5 * smooth(15.4, 16.3, t);
        bgMat.uniforms.uHaze.value = smooth(0.0, 2.0, t) * (1 - smooth(12.0, 13.2, t));

        // Roxi.
        const focusPull = smooth(6.25, 7.0, t) * (1 - smooth(11.2, 11.65, t));
        roxiMat.uniforms.uOpacity.value = smooth(3.3, 4.15, t) * (1 - smooth(11.85, 12.6, t));
        roxiMat.uniforms.uFocus.value = 1 - focusPull;
        roxiMat.uniforms.uDim.value = 1 - 0.45 * focusPull;
        roxiMat.uniforms.uSheen.value = -0.2 + 1.4 * inOut(span(t, 4.15, 5.25));

        for (const p of [roxiPts, cardPts, strandPts, eaglePts]) p.material.uniforms.uTime.value = t;
        raysMat.uniforms.uTime.value = t;
        threadMat.uniforms.uTime.value = t;
        breathMat.uniforms.uTime.value = t;

        // A warm point at her heart in the dark, taken in as she forms.
        const heart = smooth(0.2, 1.4, t) * (1 - smooth(2.0, 3.0, t));
        heartGlow.position.set(0, 1.9, 0.6);
        heartGlow.scale.setScalar(0.6 + heart * 1.4);
        heartGlow.material.opacity = heart * 0.9;

        // The light in her hand.
        const gather = smooth(5.2, 5.75, t);
        const open = smooth(6.15, 6.6, t);
        const fade = 1 - smooth(11.5, 12.0, t);
        handPath(t, handGlow.position);
        handGlow.scale.setScalar((0.25 + gather * 1.1 + open * 0.6) * fade + 0.0001);
        handGlow.material.opacity = gather * (1 - open * 0.45) * (1 - 0.7 * smooth(6.6, 7.4, t)) * fade;
        rays.position.copy(handGlow.position);
        raysMat.uniforms.uAmount.value = smooth(5.45, 6.2, t) * (1 - 0.85 * smooth(6.5, 7.4, t)) * fade;

        // Cards on the arc.
        cardMeshes.forEach((mesh, i) => {
          const st = cardState(i, t);
          mesh.position.copy(st.pos);
          mesh.rotation.set(0, st.rotY, 0);
          mesh.scale.setScalar(st.scale);
          mesh.material.uniforms.uOpacity.value = st.opacity;
          mesh.material.uniforms.uFocus.value = st.focus;
          mesh.material.uniforms.uDim.value = st.dim;
          mesh.visible = st.opacity > 0.001;
        });
        setThreads(t);

        // The meeting: a warm swell, never a white flash.
        const meet = Math.exp(-Math.pow((t - 15.05) / 0.16, 2));
        meetGlow.position.copy(MEET);
        meetGlow.scale.setScalar(0.8 + meet * 1.6);
        meetGlow.material.opacity = meet * 0.4;
        bloom.strength = (0.9 + meet * 0.2) * (1 - 0.35 * smooth(15.6, 16.4, t));

        eagleMat.uniforms.uOpacity.value = smooth(15.55, 16.15, t);

        composer.render();
      }

      // ---------- build, then register ----------
      async function build() {
        await Promise.all([
          document.fonts.load('600 92px "Geist"'),
          document.fonts.load('400 50px "Geist"'),
        ]);
        const [sharp, blur, eagleTex] = await Promise.all([loadTex("assets/roxi.png"), loadTex("assets/roxi-blur.png"), loadTex("assets/eagle.png")]);
        roxiMat.uniforms.uSharp.value = sharp;
        roxiMat.uniforms.uBlur.value = blur;
        eagleMat.uniforms.uTex.value = eagleTex;
        buildCards();
        roxiPts = buildRoxiPoints();
        cardPts = buildCardPoints();
        strandPts = buildStrands();
        eaglePts = buildEaglePoints();
        await renderer.compileAsync(scene, camera);
        renderAt(0);
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.stage = build();
    </script>

    <!-- The end card's words. -->
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      document.querySelectorAll("#wordmark span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 15.95 + i * 0.1);
      });
      tl.fromTo("#tagline", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 16.55);
      tl.fromTo("#note", { opacity: 0 }, { opacity: 0.9, duration: 0.25, ease: "power2.out" }, 16.75);
      window.__timelines["main"] = tl;
    </script>
  </body>
