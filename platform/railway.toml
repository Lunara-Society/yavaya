# Railway service configuration, kept in the repository so it cannot drift
# from what the code expects. The service's root directory is /platform.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/platform/**"]

[deploy]
# Migrate, then seed — see scripts/release.cjs for why this is one command.
preDeployCommand = ["node dist/scripts/release.cjs"]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
