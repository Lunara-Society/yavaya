<!doctype html>
<!--
  The candle to send (docs/sanctuary/CANDLE.md): the whole film — the lighting and two turns of the burning loop —
  with one line in the sender's language where the prayer sits, and the site's name at the end. It carries no
  name: the words and the link sent with it say whom it is for. LINE and SITE are set per language by make.sh.
-->
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Fraunces'; src: url('fraunces.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Jakarta'; src: url('jakarta.woff2') format('woff2'); font-weight: 200 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #040302; }
      #root { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
      #film { width: 1080px; height: 1920px; object-fit: cover; }
      #line { top: 360px; left: 110px; right: 110px; bottom: auto; text-align: center; font-family: 'Fraunces', serif; font-size: 92px; font-weight: 500; line-height: 1.12; text-wrap: balance; color: #f6ecd8; text-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 60px rgba(255, 170, 80, 0.35); }
      #rule { top: 640px; left: 500px; width: 80px; height: 3px; bottom: auto; right: auto; background: #e2c27a; }
      #site { top: auto; bottom: 120px; text-align: center; font-family: 'Jakarta', sans-serif; font-size: 38px; font-weight: 600; letter-spacing: 0.16em; color: #e2c27a; text-shadow: 0 0 20px rgba(0, 0, 0, 0.9); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1080" data-height="1920">
      <video id="film" class="clip" src="film.mp4" muted playsinline data-start="0" data-duration="12" data-track-index="0"></video>
      <div id="line" class="clip" data-start="0" data-duration="12" data-track-index="1">LINE</div>
      <div id="rule" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
      <div id="site" class="clip" data-start="0" data-duration="12" data-track-index="3">SITE</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // The words arrive as the flame settles, the way the light arrived: slowly, warming.
      tl.fromTo('#line', { opacity: 0, y: 26, filter: 'blur(6px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.4, ease: 'power2.out' }, 2.5);
      tl.fromTo('#rule', { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: 'power2.out' }, 3.2);
      tl.fromTo('#site', { opacity: 0 }, { opacity: 1, duration: 1.0, ease: 'power2.out' }, 8.8);
      tl.to({}, { duration: 0.1 }, 11.9);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
