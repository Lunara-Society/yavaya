<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Fraunces'; src: url('fraunces.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Jakarta'; src: url('jakarta.woff2') format('woff2'); font-weight: 200 800; }
      :root { --ground: #050407; --gold: #e2c27a; --gold-strong: #f3d77b; --ink: #f4ebd8; --muted: #b9b0a3; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
      #emblem { position: absolute; left: 140px; top: 360px; width: 800px; height: 800px; object-fit: cover; mix-blend-mode: lighten; }
      #glow { background: radial-gradient(circle at 50% 40%, rgba(164, 138, 240, 0.10), rgba(5, 4, 7, 0) 55%); }
      #title { top: 1170px; text-align: center; font-family: 'Fraunces', serif; font-size: 150px; font-weight: 600; letter-spacing: 0.02em; color: var(--gold); }
      #line { top: 1370px; text-align: center; font-family: 'Jakarta', sans-serif; font-size: 54px; font-weight: 500; color: var(--ink); }
      #site { top: 1560px; text-align: center; font-family: 'Jakarta', sans-serif; font-size: 40px; font-weight: 600; letter-spacing: 0.12em; color: var(--muted); }
      #rule { top: 1520px; left: 470px; width: 140px; height: 3px; background: var(--gold); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
      <div id="glow" class="clip" data-start="0" data-duration="2.6" data-track-index="0"></div>
      <video id="emblem" class="clip" src="emblem.mp4" muted playsinline data-start="0" data-duration="2.6" data-track-index="1"></video>
      <div id="title" class="clip" data-start="0" data-duration="2.6" data-track-index="2">Mirador</div>
      <div id="line" class="clip" data-start="0" data-duration="2.6" data-track-index="3">Desde aquí se ve todo</div>
      <div id="rule" class="clip" data-start="0" data-duration="2.6" data-track-index="4"></div>
      <div id="site" class="clip" data-start="0" data-duration="2.6" data-track-index="5">YAVAYA.LAT</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#glow', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0);
      tl.fromTo('#emblem', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power2.out' }, 0);
      tl.fromTo('#title', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 0.45);
      tl.fromTo('#line', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.75);
      tl.fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power2.out' }, 0.95);
      tl.fromTo('#site', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.05);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
