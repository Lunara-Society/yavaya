# The platform (platform/) on every push: typecheck, the full test suite
# against a real Postgres, the production build, and the release scripts run
# against an empty database — exactly what Railway's pre-deploy executes.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    services:
      # The integration tests are the point: they exercise the append-only
      # triggers, the ledger's exactly-once behaviour and the audit hash chain,
      # none of which can be verified without a real Postgres.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yavaya
          POSTGRES_PASSWORD: yavaya
          POSTGRES_DB: yavaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://yavaya:yavaya@127.0.0.1:5432/yavaya_test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          SESSION_SECRET: build-time-placeholder-value-not-used-at-runtime
          SIGNAL_PEPPER: build-time-placeholder-value-not-used-at-runtime

      - name: Release step against a fresh database
        # release.cjs is what Railway runs before a deploy: migrate, then
        # seed. Run it twice — the second run proves it is idempotent.
        run: |
          PGPASSWORD=yavaya createdb -h 127.0.0.1 -U yavaya yavaya_release
          node dist/scripts/release.cjs
          node dist/scripts/release.cjs
        env:
          DATABASE_URL: postgres://yavaya:yavaya@127.0.0.1:5432/yavaya_release
          SESSION_SECRET: ci-check-secret-value-that-is-long-enough-000000
          SIGNAL_PEPPER: ci-check-pepper-value-that-is-long-enough-000000
          NODE_ENV: production
          APP_ENV: production
