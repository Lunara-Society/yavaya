name: Deploy to Railway

# Why this exists.
#
# Railway normally builds from a connected GitHub repository. This one is
# private and Railway's GitHub App is not installed on it, so that path is
# closed. Railway's CLI can upload a directory directly instead — but the
# environment where this repository is developed has no network route to
# railway.com.
#
# A GitHub Actions runner has both: a checkout of the code and unrestricted
# egress. So the deploy runs here.
#
# The token is a `workflow_dispatch` input rather than a repository secret
# because it is supplied at trigger time. It is masked in the logs, but the
# input value is still recorded in the run's metadata — treat any token used
# here as disposable and rotate it once the run finishes.

on:
  workflow_dispatch:
    inputs:
      railway_token:
        description: 'Railway token (project or account scope). Rotate it after this run.'
        required: true
        type: string
      service:
        description: 'Railway service name'
        required: false
        default: 'yavaya-web'
        type: string

env:
  # The Railway project this repository deploys to. Ids rather than names:
  # names are mutable and there is no ambiguity to resolve at deploy time.
  PROJECT_ID: 682b2a31-cad5-4e80-a863-51a4dd23f012
  ENVIRONMENT_ID: 2f3e40da-c664-41f9-a583-f5db9dcb8d71

jobs:
  deploy:
    name: Upload and build on Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Mask the token before anything can echo it
        run: echo "::add-mask::${{ inputs.railway_token }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Identify the token
        # Never fails the job. Railway has two token kinds and they are read
        # from two different variables:
        #
        #   RAILWAY_TOKEN      project token, scoped to one environment
        #   RAILWAY_API_TOKEN  account or team token
        #
        # A token in the wrong variable reports "Invalid RAILWAY_TOKEN", which
        # is indistinguishable from a revoked one. So both are probed, and the
        # result decides how the deploy runs.
        id: probe
        continue-on-error: true
        run: |
          if RAILWAY_TOKEN="${{ inputs.railway_token }}" railway status >/dev/null 2>&1; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "Token works as a PROJECT token."
          elif RAILWAY_API_TOKEN="${{ inputs.railway_token }}" railway whoami >/dev/null 2>&1; then
            echo "kind=account" >> "$GITHUB_OUTPUT"
            echo "Token works as an ACCOUNT token."
            RAILWAY_API_TOKEN="${{ inputs.railway_token }}" railway whoami
          else
            echo "kind=none" >> "$GITHUB_OUTPUT"
            echo "Token rejected as both kinds. Diagnostics:"
            RAILWAY_TOKEN="${{ inputs.railway_token }}" railway status 2>&1 | sed 's/^/  [project] /' || true
            RAILWAY_API_TOKEN="${{ inputs.railway_token }}" railway whoami 2>&1 | sed 's/^/  [account] /' || true
          fi

      - name: Stop early if the token is not valid
        if: steps.probe.outputs.kind == 'none'
        run: |
          echo "::error::Railway rejected this token as both a project token and an account token."
          echo "Create a new one:"
          echo "  Project token — Railway > project 'yavaya' > Settings > Tokens > New Token (environment: production)"
          echo "  Account token — Railway > Account Settings > Tokens > New Token"
          exit 1

      - name: Deploy with a project token
        if: steps.probe.outputs.kind == 'project'
        env:
          RAILWAY_TOKEN: ${{ inputs.railway_token }}
        run: |
          # --ci streams the build log and exits on completion rather than
          # detaching, so this job's success means the build actually finished.
          railway up --service "${{ inputs.service }}" --ci

      - name: Deploy with an account token
        if: steps.probe.outputs.kind == 'account'
        env:
          RAILWAY_API_TOKEN: ${{ inputs.railway_token }}
        run: |
          # An account token is not bound to a project, so the target is named
          # explicitly by id rather than inferred.
          railway link \
            --project "${{ env.PROJECT_ID }}" \
            --environment "${{ env.ENVIRONMENT_ID }}" \
            --service "${{ inputs.service }}"
          railway up --service "${{ inputs.service }}" --ci
